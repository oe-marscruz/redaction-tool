name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-presidio-optional.txt

      - name: PR Scope & Safety Gate
        run: python scripts/ci_scope_gate.py

      - name: Syntax check
        # PowerShell does not expand shell globs, so let Python do it.
        run: |
          python -c "import py_compile, pathlib; [py_compile.compile(str(p), doraise=True) for p in [pathlib.Path('run.py'), pathlib.Path('validate_real_files.py'), *pathlib.Path('redaction_tool').glob('*.py'), *pathlib.Path('scripts').glob('*.py')]]"

      - name: Unit + regression + security tests
        run: |
          python tests/test_core.py
          python tests/test_high_recall.py
          python tests/test_presidio_integration.py
          python -m unittest tests/test_document_context.py
          python -m unittest tests/test_security_verification.py
          python -m unittest tests/test_end_to_end_presidio.py
          python -m unittest tests/test_platform_paths.py
          python -m unittest tests/test_product_features.py

      - name: Synthetic evaluation corpus
        run: python tests/eval_metrics.py

      - name: Headless self-test
        run: python run.py --selftest result.txt

      - name: Show self-test result
        run: type result.txt

  # Same checks as the Windows job, on Linux. This is the regression gate for
  # the cross-platform paths, launcher, Tesseract discovery and GUI startup.
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system packages
        # tesseract + English data: the OCR path uses the distro Tesseract on
        # Linux. python3-tk provides the Tk shared libraries that the
        # setup-python interpreter links against. xvfb runs the GUI test.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng python3-tk xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-presidio-optional.txt

      - name: PR Scope & Safety Gate
        run: python scripts/ci_scope_gate.py

      - name: Environment report
        # Fails loudly instead of silently skipping the GUI test if Tk or
        # Tesseract is missing from the runner image.
        run: |
          python tests/check_dependencies.py
          python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Syntax check
        run: |
          python -c "import py_compile, pathlib; [py_compile.compile(str(p), doraise=True) for p in [pathlib.Path('run.py'), pathlib.Path('validate_real_files.py'), *pathlib.Path('redaction_tool').glob('*.py'), *pathlib.Path('scripts').glob('*.py')]]"

      - name: Unit + regression + security tests
        run: |
          python tests/test_core.py
          python tests/test_high_recall.py
          python tests/test_presidio_integration.py
          python -m unittest tests/test_document_context.py
          python -m unittest tests/test_security_verification.py
          python -m unittest tests/test_end_to_end_presidio.py
          python -m unittest tests/test_platform_paths.py
          python -m unittest tests/test_product_features.py

      - name: GUI smoke test (headless X server)
        run: xvfb-run -a python -m unittest tests/test_gui_smoke.py

      - name: Synthetic evaluation corpus
        run: python tests/eval_metrics.py

      - name: Headless self-test
        run: python run.py --selftest result.txt

      - name: Show self-test result
        run: cat result.txt

      - name: Launcher smoke test
        # The double-click launcher must work from a clean checkout.
        run: |
          ./Run-RedactionTool.sh --help
          ./Run-RedactionTool.sh --selftest launcher_result.txt
          cat launcher_result.txt

  # Builds the real Linux binary and asserts its packaged Presidio and OCR
  # self-tests pass. Mirrors installer-smoke for the Windows executable.
  linux-bundle-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng python3-tk

      - name: Build real executable
        # build_linux.sh creates .venv, installs both requirement sets plus
        # PyInstaller, stages the pinned spaCy model, builds, and runs the
        # packaged self-test (Presidio + OCR).
        run: ./build_linux.sh

      - name: Verify packaged self-test report
        run: |
          grep -q "PASS bundled Presidio" exe_selftest.txt
          grep -q "PASS bundled OCR" exe_selftest.txt
          cat exe_selftest.txt

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle-smoke
          path: dist/RedactionTool
          if-no-files-found: error

  # Builds the real executable and asserts the packaged Presidio and OCR
  # self-tests pass. A placeholder-exe script-compile smoke test cannot detect
  # a presidio-less or OCR-less artifact.
  installer-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Install Tesseract OCR
        # windows-latest no longer ships Tesseract at
        # C:\Program Files\Tesseract-OCR, so install it explicitly instead of
        # assuming the image provides it.
        run: choco install tesseract -y --no-progress

      - name: Locate Tesseract
        id: tesseract
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files\Tesseract-OCR",
            "C:\Program Files (x86)\Tesseract-OCR"
          )
          $dir = $candidates | Where-Object { Test-Path (Join-Path $_ "tesseract.exe") } |
            Select-Object -First 1
          if (-not $dir) {
            Write-Error "Tesseract was not found after installation"; exit 1
          }
          Write-Host "Using Tesseract at $dir"
          "dir=$dir" >> $env:GITHUB_OUTPUT

      - name: Read package version
        id: version
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts'); import version_file; print('version=' + version_file.read_package_version())" >> $env:GITHUB_OUTPUT

      - name: Verify build script model hash pin
        # build_windows.ps1 compares Get-FileHash output (always 64 hex chars)
        # against its pinned constant. A constant of any other length makes the
        # real build throw, so fail here instead of in the release build.
        run: python scripts/check_model_pin.py

      - name: Build real executable
        # build_windows.ps1 creates its own .venv, installs both requirement
        # sets plus PyInstaller, downloads and hash-verifies the spaCy model
        # wheel, and stages the model, so this job installs no dependencies
        # itself. Script-compile smoke testing against a placeholder exe cannot
        # detect a presidio-less build, so exercise the real build instead.
        run: |
          $ErrorActionPreference = "Stop"
          .\build_windows.ps1 -TesseractDir "${{ steps.tesseract.outputs.dir }}"
          # Throws surface as non-terminating by default in some hosts, so
          # assert the real outputs rather than trusting the exit code alone.
          if (-not (Test-Path "dist\RedactionTool.exe")) {
            Write-Error "dist\RedactionTool.exe was not produced"; exit 1
          }
          if (-not (Test-Path "exe_selftest.txt")) {
            Write-Error "exe_selftest.txt was not produced"; exit 1
          }

      - name: Verify packaged Presidio and OCR self-test
        # build_windows.ps1 already throws on either failure; re-assert here so
        # the job fails loudly if that guard is ever loosened or skipped.
        run: |
          if (-not (Test-Path exe_selftest.txt)) {
            Write-Error "exe_selftest.txt was not produced by the build"; exit 1
          }
          $report = Get-Content exe_selftest.txt -Raw
          Write-Host $report
          if ($report -notmatch "PASS bundled OCR") { Write-Error "Packaged self-test did not report PASS bundled OCR"; exit 1 }
          if ($report -notmatch "PASS bundled Presidio") { Write-Error "Packaged self-test did not report PASS bundled Presidio"; exit 1 }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-smoke
          path: installer/Output/RedactionTool-Setup-*.exe
          if-no-files-found: error
