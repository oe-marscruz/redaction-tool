name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile redaction_tool/*.py run.py validate_real_files.py

      - name: Unit + regression tests
        run: |
          python tests/test_core.py
          python tests/test_high_recall.py

      - name: Synthetic evaluation corpus
        run: python tests/eval_metrics.py

      - name: Headless self-test
        run: python run.py --selftest result.txt

      - name: Show self-test result
        run: type result.txt
